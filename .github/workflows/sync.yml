name: Sync Procesos Judiciales (Lote)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.API_URL }}" ]; then
            echo "ERROR: Repository secret API_URL is not set." >&2
            exit 1
          fi
          if [ -z "${{ secrets.API_TOKEN }}" ]; then
            echo "ERROR: Repository secret API_TOKEN is not set." >&2
            exit 1
          fi

      - name: Wake up server (max 3 min)
        run: |
          echo "Esperando a que el servidor responda..."
          for i in $(seq 1 18); do
            RESP=$(curl -sS -o /dev/null -w "%{http_code}" "${{ secrets.API_URL }}/health" 2>&1)
            if [ "$RESP" = "200" ]; then
              echo "Servidor listo"
              exit 0
            fi
            echo "Intento $i/18 - respuesta $RESP, esperando 10s..."
            sleep 10
          done
          echo "El servidor no respondio a tiempo"
          exit 1

      - name: Sync lote (con retry)
        env:
          API_URL: ${{ secrets.API_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          echo "Sincronizando lote de 25 radicados..."

          RESULT=$(curl -s -w "\n%{http_code}" \
            --retry 3 --retry-delay 30 --retry-all-errors \
            -X POST "${API_URL}/procesos/sync-lote" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${API_TOKEN}" \
            --max-time 600)

          HTTP_CODE=$(echo "$RESULT" | tail -1)
          BODY=$(echo "$RESULT" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Error HTTP $HTTP_CODE: $BODY"
            exit 1
          fi

          MENSAJE=$(echo "$BODY" | jq -r '.mensaje // empty')
          if [ -n "$MENSAJE" ]; then
            echo "⚠️  $MENSAJE"
            echo "Esto no es un error de la app — Rama Judicial esta caida."
            exit 0
          fi

          echo ""
          echo "Consultados: $(echo "$BODY" | jq -r '.total_consultados // 0')"
          echo "Usuarios:   $(echo "$BODY" | jq -r '.usuarios_afectados // 0')"
          echo "Privados:   $(echo "$BODY" | jq -r '.radicados_privados | length')"
          echo "Nuevos:      $(echo "$BODY" | jq -r '.nuevos // 0')"
          echo "Actualizados:$(echo "$BODY" | jq -r '.actualizados // 0')"
          echo "Notificaciones: $(echo "$BODY" | jq -r '.emails_enviados | length')"
          echo "Reenviadas:  $(echo "$BODY" | jq -r '.notificaciones_reenviadas | length')"
          echo "Errores Rama: $(echo "$BODY" | jq -r '.errores_rama // 0')"
          echo "Errores App:  $(echo "$BODY" | jq -r '.errores_app // 0')"
          echo "Saltados (Rama inestable): $(echo "$BODY" | jq -r '.radicados_saltados_rama | length')"

          APP_ERRORS=$(echo "$BODY" | jq -r '[.radicados_error_consulta[]? | select(.origen == "app")] | length' 2>/dev/null || echo 0)
          if [ "$APP_ERRORS" -gt 0 ]; then
            echo "🔴 ATENCION: $APP_ERRORS error(es) internos de la app. Revisar logs de Render."
            echo "$BODY" | jq -r '.radicados_error_consulta[]? | select(.origen == "app") | "  - \(.radicado // "?"): \(.error // "?")"'
            echo "FALLO: hay errores internos de la app." >&2
            exit 1
          fi

          RAMA_ERRORS=$(echo "$BODY" | jq -r '[.radicados_error_consulta[]? | select(.origen == "rama")] | length' 2>/dev/null || echo 0)
          if [ "$RAMA_ERRORS" -gt 0 ]; then
            echo "⚠️  $RAMA_ERRORS radicado(s) fallaron por Rama Judicial (la app esta bien)."
            echo "Se reintentara en el proximo ciclo automaticamente."
          fi

          SALTADOS=$(echo "$BODY" | jq -r '.radicados_saltados_rama | length')
          if [ "$SALTADOS" -gt 0 ]; then
            echo "⚠️  Rama Judicial se volvio inestable a mitad del lote; $SALTADOS radicados se saltaron."
            echo "La app detecto el problema y no se colgo (la app esta bien)."
          fi

          echo ""
          echo "Sync lote completado"
