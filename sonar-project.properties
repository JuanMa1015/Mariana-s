# Project identity is supplied by GitHub repository variables in CI.
sonar.sourceEncoding=UTF-8
sonar.sources=apps/api,apps/web/src
sonar.tests=apps/api/tests,apps/web/src
sonar.test.inclusions=apps/api/tests/**,apps/web/src/**/*.test.ts,apps/web/src/**/*.test.tsx,apps/web/src/test/**
sonar.exclusions=apps/api/tests/**,apps/api/.venv/**,apps/api/**/__pycache__/**,apps/web/src/**/*.test.ts,apps/web/src/**/*.test.tsx,apps/web/src/test/**,apps/web/src/**/*.d.ts
sonar.python.version=3.11
sonar.python.coverage.reportPaths=apps/api/coverage.xml
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
